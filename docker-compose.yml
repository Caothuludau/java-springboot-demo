services:
  khu-mo-web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./khu-mo-web:/app
      - khu_mo_web_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: >
      sh -c "
      if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then
        npm install;
      fi;
      npm run dev -- --hostname 0.0.0.0 --port 3000
      "

volumes:
  khu_mo_web_node_modules:
